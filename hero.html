<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; min-height:100%; background:#080608; color:#e8d9c0; font-family:'Manrope',sans-serif; overflow-x:hidden; }

  /* ─── Фон ─── */
  body::before{
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(80,30,0,.55) 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(20,10,40,.6) 0%, transparent 70%);
    z-index:0; pointer-events:none;
  }

  /* ─── Шапка ─── */
  header{
    position:relative; z-index:10;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px;
    border-bottom:1px solid rgba(200,120,30,.2);
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);
  }
  .back-btn{
    background:none; border:1px solid rgba(200,140,40,.4); border-radius:5px;
    color:#c8922a; font-family:'Cinzel',serif; font-size:.85rem;
    padding:8px 18px; cursor:pointer; letter-spacing:.1em;
    transition:.15s; text-decoration:none; display:inline-block;
  }
  .back-btn:hover{ border-color:#c8922a; background:rgba(200,140,40,.08); }
  .header-title{
    font-family:'Cinzel',serif; font-weight:700; font-size:1.1rem;
    color:#c8922a; letter-spacing:.15em; text-transform:uppercase;
    position:absolute; left:50%; transform:translateX(-50%);
  }

  /* ─── Главный контейнер ─── */
  .page{ position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:28px 20px 60px; }

  /* ─── Карточка персонажа ─── */
  .hero-card{
    display:flex; gap:24px; align-items:flex-start;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(200,140,40,.25);
    border-radius:12px; padding:24px;
    margin-bottom:28px;
  }
  @media(max-width:600px){
    .hero-card{ flex-direction:column; align-items:center; }
  }
  .hero-avatar{
    width:120px; height:120px; flex-shrink:0;
    background:rgba(200,120,20,.12);
    border:2px solid rgba(200,140,40,.35);
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-size:3.8rem;
    box-shadow:0 0 30px rgba(200,120,20,.2);
  }
  .hero-avatar.has-art{
    background-size:cover;
    background-position:center;
    color:transparent;
    overflow:hidden;
  }
  .hero-info{ flex:1; }
  .hero-name{
    font-family:'Cinzel',serif; font-weight:700;
    font-size:1.8rem; color:#f5d070;
    text-shadow:0 0 18px rgba(245,180,60,.5);
    margin-bottom:4px;
  }
  .hero-role{ color:#9b7030; font-size:.9rem; letter-spacing:.12em; text-transform:uppercase; margin-bottom:16px; }

  /* XP бар */
  .xp-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .xp-label{ font-size:.8rem; color:#9b7030; min-width:55px; }
  .xp-bar{ flex:1; height:8px; background:rgba(255,255,255,.1); border-radius:4px; overflow:hidden; }
  .xp-fill{ height:100%; background:linear-gradient(90deg,#c8922a,#ffd700); border-radius:4px; transition:width .5s; }
  .level-badge{
    background:linear-gradient(135deg,#3d1a00,#7a3500);
    border:1px solid #c8922a; border-radius:20px;
    color:#f5d070; font-family:'Cinzel',serif; font-weight:700;
    font-size:.85rem; padding:4px 12px; white-space:nowrap;
  }
  .sp-badge{
    background:rgba(100,200,120,.15);
    border:1px solid rgba(100,200,120,.4);
    color:#80e890; font-size:.78rem;
    border-radius:4px; padding:3px 9px; cursor:default;
  }

  /* Статы */
  .stats-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:4px; }
  @media(max-width:400px){ .stats-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat-item{
    background:rgba(255,255,255,.04); border:1px solid rgba(200,140,40,.15);
    border-radius:8px; padding:10px 12px; text-align:center;
  }
  .stat-item .si-val{ font-family:'Cinzel',serif; font-size:1.15rem; color:#f5d070; }
  .stat-item .si-lbl{ font-size:.7rem; color:#6e5028; text-transform:uppercase; letter-spacing:.1em; margin-top:2px; }

  /* ─── Секции ─── */
  .section-title{
    font-family:'Cinzel',serif; font-weight:700; font-size:1rem;
    color:#c8922a; letter-spacing:.12em; text-transform:uppercase;
    border-bottom:1px solid rgba(200,140,40,.2); padding-bottom:8px; margin-bottom:16px;
  }
  .section{ margin-bottom:28px; }

  /* ─── Оружие ─── */
  .weapon-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px; }
  .weapon-card{
    background:rgba(255,255,255,.04); border:1px solid rgba(200,140,40,.2);
    border-radius:8px; padding:14px 10px; text-align:center;
    cursor:pointer; transition:.18s; position:relative;
  }
  .weapon-card:hover{ border-color:#c8922a; background:rgba(200,140,40,.08); }
  .weapon-card.equipped{
    border-color:#f5d070; background:rgba(245,200,60,.07);
    box-shadow:0 0 16px rgba(245,200,60,.2);
  }
  .weapon-card.equipped::after{
    content:'Экипировано'; position:absolute; bottom:6px; left:0; right:0;
    font-size:.62rem; color:#f5d070; letter-spacing:.08em;
  }
  .weapon-icon{ font-size:2rem; margin-bottom:6px; }
  .weapon-name{ font-size:.78rem; color:#e8d9c0; font-weight:600; }
  .weapon-stat{ font-size:.7rem; color:#9b7030; margin-top:3px; }
  .weapon-cost{ font-size:.7rem; color:#f5d070; margin-top:4px; }
  .weapon-locked{ opacity:.4; cursor:not-allowed; }

  /* ─── Дерево навыков ─── */
  .skill-tier{ margin-bottom:12px; }
  .tier-label{ font-size:.72rem; color:#6e5028; text-transform:uppercase; letter-spacing:.15em; margin-bottom:8px; }
  .skill-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .skill-node{
    background:rgba(255,255,255,.04); border:1px solid rgba(200,140,40,.2);
    border-radius:8px; padding:10px 14px; min-width:120px; max-width:180px;
    cursor:pointer; transition:.18s; position:relative; text-align:center;
  }
  .skill-node:hover:not(.locked):not(.unlocked){ border-color:#c8922a; background:rgba(200,140,40,.1); }
  .skill-node.unlocked{ border-color:#80e890; background:rgba(100,200,120,.06); }
  .skill-node.locked{ opacity:.38; cursor:not-allowed; }
  .skill-node .sn-icon{ font-size:1.4rem; }
  .skill-node .sn-name{ font-size:.74rem; font-weight:700; color:#e8d9c0; margin:4px 0 2px; }
  .skill-node .sn-desc{ font-size:.65rem; color:#7a5828; line-height:1.3; }
  .skill-node .sn-cost{
    display:inline-block; background:rgba(100,200,120,.15); border:1px solid rgba(100,200,120,.3);
    color:#80e890; font-size:.62rem; border-radius:3px; padding:1px 6px; margin-top:4px;
  }
  .skill-node.unlocked .sn-cost{ background:rgba(100,200,120,.25); color:#afffbb; }

  /* Мага — выбор элемента */
  .element-picker{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .el-btn{
    background:rgba(255,255,255,.05); border:1px solid rgba(200,140,40,.25);
    border-radius:6px; padding:8px 16px; cursor:pointer;
    font-size:.82rem; color:#e8d9c0; transition:.15s;
  }
  .el-btn:hover{ border-color:#c8922a; }
  .el-btn.active{ border-color:var(--ec); background:rgba(255,255,255,.08); color:var(--ec); box-shadow:0 0 14px color-mix(in srgb,var(--ec) 40%,transparent); }

  /* ─── Кнопка похода ─── */
  .dungeon-btn{
    display:block; width:100%; padding:18px;
    background:linear-gradient(135deg,#1a0a2e 0%,#3d1060 50%,#1a0a2e 100%);
    border:2px solid #8844cc; border-radius:10px;
    color:#d4a8ff; font-family:'Cinzel',serif; font-weight:700;
    font-size:1.1rem; letter-spacing:.1em; text-transform:uppercase;
    cursor:pointer; transition:.18s;
    box-shadow:0 0 28px rgba(136,60,220,.3);
    text-align:center; text-decoration:none;
  }
  .dungeon-btn:hover{ box-shadow:0 0 44px rgba(180,80,255,.5); transform:scale(1.02); border-color:#b36eff; }
  .dungeon-btn:active{ transform:scale(.98); }

  /* Toast */
  #toast{
    position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(40px);
    background:rgba(20,10,40,.9); border:1px solid #8844cc; border-radius:8px;
    padding:10px 24px; color:#d4a8ff; font-size:.85rem; letter-spacing:.06em;
    transition:.3s; opacity:0; pointer-events:none; z-index:999; white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

    {id:'chain_lightning',tier:3,name:'Цепная молния',desc:'Молния прыгает на 3 цели',icon:'⚡',req:['tornado'],   cost:3},
    {id:'cyclone',    tier:4, name:'Циклон',         desc:'Гигантский торнадо на поле',icon:'🌪️',req:['storm_aura','chain_lightning'],cost:5},
  ]},
};

const HERO_SAVE_KEY = 'kia_hero_progress';
const HERO_ART = {
  knight:{ src:'image/Gemini_Generated_Image_l80991l80991l809.png', label:'RAGNAR', icon:'⚔', bg1:'#111725', bg2:'#293f73', frame:'#9ab8ff', glow:'#87a6ff' },
  assassin:{ label:'LIORA', icon:'🗡', bg1:'#1b140a', bg2:'#6d4517', frame:'#ffd37f', glow:'#f5c36a' },
  mage:{ label:'SELENA', icon:'✦', bg1:'#170a23', bg2:'#5c2d8e', frame:'#f0b7ff', glow:'#d495ff' },
};
function escSvg(text){
  return String(text||'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\"/g,'&quot;')
    .replace(/'/g,'&#39;');
}
function heroArtUrl(key){
  const meta=HERO_ART[key]||HERO_ART.knight;
  if(meta.src) return meta.src;
  if(!meta.dataUrl){
    const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 320'>"
      +"<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='"+meta.bg1+"'/><stop offset='100%' stop-color='"+meta.bg2+"'/></linearGradient><radialGradient id='r' cx='50%' cy='42%' r='52%'><stop offset='0%' stop-color='"+meta.glow+"' stop-opacity='.75'/><stop offset='100%' stop-color='"+meta.glow+"' stop-opacity='0'/></radialGradient></defs>"
      +"<rect width='320' height='320' rx='36' fill='url(#g)'/><rect x='12' y='12' width='296' height='296' rx='28' fill='none' stroke='"+meta.frame+"' stroke-width='4'/><circle cx='162' cy='148' r='112' fill='url(#r)'/>"
      +"<path d='M66 260 C102 182 124 116 160 98 C196 116 222 182 254 260' fill='"+meta.bg1+"' fill-opacity='.58'/><text x='34' y='54' font-family='Cinzel, serif' font-size='28' font-weight='700' fill='"+meta.frame+"'>"+escSvg(meta.label)+"</text><text x='160' y='210' text-anchor='middle' font-size='120' font-family='Segoe UI Emoji, Apple Color Emoji, sans-serif'>"+escSvg(meta.icon)+"</text></svg>";
    meta.dataUrl='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
  }
  return meta.dataUrl;
}

// ─────────────────────────────────────────────────
// Загрузка / сохранение
// ─────────────────────────────────────────────────
function loadProgress(){
  try{
    const d = JSON.parse(localStorage.getItem(HERO_SAVE_KEY)||'{}');
    return {
      knight:   Object.assign({level:1,xp:0,sp:0,unlocked:[],weapon:'sw_iron',  coins:0},d.knight||{}),
      assassin: Object.assign({level:1,xp:0,sp:0,unlocked:[],weapon:'dg_basic', coins:0},d.assassin||{}),
      mage:     Object.assign({level:1,xp:0,sp:0,unlocked:[],weapon:'st_wood',  coins:0,element:'fire'},d.mage||{}),
    };
  }catch(e){
    return {
      knight:  {level:1,xp:0,sp:0,unlocked:[],weapon:'sw_iron',  coins:0},
      assassin:{level:1,xp:0,sp:0,unlocked:[],weapon:'dg_basic', coins:0},
      mage:    {level:1,xp:0,sp:0,unlocked:[],weapon:'st_wood',  coins:0,element:'fire'},
    };
  }
}

function saveProgress(data){
  localStorage.setItem(HERO_SAVE_KEY, JSON.stringify(data));
}

function xpForLevel(lv){ return 100+(lv-1)*80; }

// ─────────────────────────────────────────────────
// Параметры из URL: ?hero=knight
// ─────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
let heroKey   = params.get('hero') || 'knight';
if(!HERO_DATA[heroKey]) heroKey = 'knight';

let progress  = loadProgress();
let heroData  = HERO_DATA[heroKey];
let heroP     = progress[heroKey];

// ─────────────────────────────────────────────────
// Рендер страницы
// ─────────────────────────────────────────────────
function getSkillTreeKey(){
  if(heroKey==='mage') return 'mage_'+(heroP.element||'fire');
  return heroKey;
}

function render(){
  heroP = progress[heroKey];
  const xpMax = xpForLevel(heroP.level);
  const xpPct = Math.min(100, Math.round(heroP.xp/xpMax*100));
  const tree   = SKILL_TREES[getSkillTreeKey()];
  const weapons = WEAPONS[heroKey];

  // Вычислить бонус оружия
  const equippedW = weapons.find(w=>w.id===heroP.weapon) || weapons[0];
  const totalAtk = heroData.atk[0] + (equippedW?equippedW.atk:0);

  // Элементы для мага
  let elPickerHTML = '';
  if(heroKey==='mage'){
    elPickerHTML = `<div class="section">
      <div class="section-title">Стихия магии</div>
      <div class="element-picker">
        ${Object.entries(MAGE_ELEMENTS).map(([k,el])=>`
          <button class="el-btn${heroP.element===k?' active':''}"
            style="--ec:${el.color}"
            onclick="setElement('${k}')">${el.icon} ${el.name}</button>
        `).join('')}
      </div>
    </div>`;
  }

  // Тиры навыков
  const tiers = [1,2,3,4];
  const skillsHTML = tiers.map(tier=>{
    const nodes = tree.skills.filter(s=>s.tier===tier);
    if(!nodes.length) return '';
    const nodesHTML = nodes.map(sk=>{
      const unlocked = heroP.unlocked.includes(sk.id);
      const reqMet   = sk.req.every(r=>heroP.unlocked.includes(r));
      const canBuy   = !unlocked && reqMet && heroP.sp>=sk.cost;
      const cls      = unlocked?'unlocked':(reqMet?'available':'locked');
      return `<div class="skill-node ${cls}" onclick="_onSkill('${sk.id}')">
        <div class="sn-icon">${sk.icon}</div>
        <div class="sn-name">${sk.name}</div>
        <div class="sn-desc">${sk.desc}</div>
        ${unlocked?`<span class="sn-cost">✓ Изучено</span>`:`<span class="sn-cost">⬡ ${sk.cost} ОН</span>`}
      </div>`;
    }).join('');
    return `<div class="skill-tier">
      <div class="tier-label">Уровень ${tier}</div>
      <div class="skill-row">${nodesHTML}</div>
    </div>`;
  }).join('');

  // Оружие
  const weaponsHTML = weapons.map(w=>{
    const equipped = (heroP.weapon===w.id);
    const owned    = (w.cost===0||(heroP.purchasedWeapons||[]).includes(w.id));
    const locked   = !owned;
    return `<div class="weapon-card${equipped?' equipped':''}${locked?' weapon-locked':''}"
        onclick="_onWeapon('${w.id}',${w.cost},${owned})">
        <div class="weapon-icon">${w.icon}</div>
        <div class="weapon-name">${w.name}</div>
        <div class="weapon-stat">${w.bonus}</div>
        <div class="weapon-cost">${owned?(equipped?'⚔ Экипировано':'Надеть'):`🪙 ${w.cost}`}</div>
      </div>`;
  }).join('');

  document.getElementById('heroPage').innerHTML = `
    <!-- ── Карточка персонажа ── -->
    <div class="hero-card">
      <div class="hero-avatar has-art" style="background-image:url('${heroArtUrl(heroKey)}')"></div>
      <div class="hero-info">
        <div class="hero-name">${heroData.name}</div>
        <div class="hero-role">${heroData.role}</div>

        <div class="xp-row">
          <span class="xp-label">Уровень</span>
          <span class="level-badge">Lv. ${heroP.level}</span>
          <div class="xp-bar"><div class="xp-fill" style="width:${xpPct}%"></div></div>
          <span style="font-size:.72rem;color:#6e5028;white-space:nowrap">${heroP.xp}/${xpMax}</span>
          <span class="sp-badge">⬡ ${heroP.sp} ОН</span>
        </div>

        <div class="stats-grid">
          <div class="stat-item"><div class="si-val">${heroData.hp + (heroP.level-1)*20}</div><div class="si-lbl">❤ HP</div></div>
          <div class="stat-item"><div class="si-val">${totalAtk}</div><div class="si-lbl">⚔ ATK</div></div>
          <div class="stat-item"><div class="si-val">${heroData.spd.toFixed(1)}</div><div class="si-lbl">💨 SPD</div></div>
          <div class="stat-item"><div class="si-val">${heroData.atkCd}мс</div><div class="si-lbl">⏱ КД ATK</div></div>
          <div class="stat-item"><div class="si-val">${heroData.ab1Name}</div><div class="si-lbl">⚡ Умение 1</div></div>
          <div class="stat-item"><div class="si-val">${heroData.ab2Name}</div><div class="si-lbl">💫 Умение 2</div></div>
        </div>
        <p style="font-size:.75rem;color:#5a4020;margin-top:12px;line-height:1.5;font-style:italic">"${heroData.lore}"</p>
      </div>
    </div>

    <!-- ── Элемент мага ── -->
    ${elPickerHTML}

    <div class="section">
      <div class="section-title">Тренировочный зал</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="el-btn" onclick="trainHero(1)">Тренировка I · 50 🪙 · +40 XP</button>
        <button class="el-btn" onclick="trainHero(2)">Тренировка II · 120 🪙 · +110 XP</button>
        <button class="el-btn" onclick="trainHero(3)">Тренировка III · 260 🪙 · +260 XP</button>
      </div>
      <p style="margin-top:8px;color:#8a6633;font-size:.75rem">Прокачка героя выполняется здесь, в профиле, а не во время боя.</p>
    </div>

    <!-- ── Оружие ── -->
    <div class="section">
      <div class="section-title">Оружие <span style="font-size:.75rem;color:#6e5028">· 🪙 ${heroP.coins} монет</span></div>
      <div class="weapon-grid">${weaponsHTML}</div>
    </div>

    <!-- ── Дерево навыков ── -->
    <div class="section">
      <div class="section-title">${tree.name} <span style="font-size:.75rem;color:#6e5028">· ⬡ ${heroP.sp} очков навыков</span></div>
      ${skillsHTML}
    </div>

    <!-- ── Кнопка похода ── -->
    <button class="dungeon-btn" onclick="startDungeon()">
      ⚔&nbsp;&nbsp;Начать поход в подземелья&nbsp;&nbsp;▼
    </button>
  `;
}

// ─────────────────────────────────────────────────
// Действия
// ─────────────────────────────────────────────────
window._onSkill = function(skillId){
  const tree = SKILL_TREES[getSkillTreeKey()];
  const sk   = tree.skills.find(s=>s.id===skillId);
  if(!sk) return;

  if(heroP.unlocked.includes(sk.id)){ toast('Уже изучено!'); return; }

  const reqMet = sk.req.every(r=>heroP.unlocked.includes(r));
  if(!reqMet){ toast('Сначала изучи необходимые навыки'); return; }

  if(heroP.sp < sk.cost){ toast(`Нужно ${sk.cost} ОН навыков — сейчас ${heroP.sp}`); return; }

  heroP.sp -= sk.cost;
  heroP.unlocked.push(sk.id);
  saveProgress(progress);
  toast(`Изучено: ${sk.name}!`);
  render();
};

window._onWeapon = function(weaponId, cost, owned){
  if(heroP.weapon===weaponId){ toast('Уже экипировано'); return; }

  if(!owned){
    if(heroP.coins < cost){ toast(`Нужно 🪙 ${cost} монет — есть ${heroP.coins}`); return; }
    heroP.coins -= cost;
    if(!heroP.purchasedWeapons) heroP.purchasedWeapons=[];
    heroP.purchasedWeapons.push(weaponId);
    toast('Оружие куплено!');
  }

  heroP.weapon = weaponId;
  saveProgress(progress);
  toast('Оружие экипировано ⚔');
  render();
};

window.setElement = function(el){
  heroP.element = el;
  const elData = MAGE_ELEMENTS[el];
  heroData.ab1Name = elData.ab1;
  heroData.ab2Name = elData.ab2;
  heroData.color   = elData.color;
  saveProgress(progress);
  render();
};

window.startDungeon = function(){
  // Сохраняем выбранного героя и флаг запуска подземелья
  localStorage.setItem('kia_chosen_hero', heroKey);
  localStorage.setItem('kia_start_dungeon', heroKey);
  location.href = 'index.html';
};

window.trainHero = function(tier){
  const plans={
    1:{cost:50,xp:40},
    2:{cost:120,xp:110},
    3:{cost:260,xp:260},
  };
  const plan=plans[tier]||plans[1];
  if(heroP.coins<plan.cost){
    toast(`Нужно ${plan.cost} 🪙, доступно ${heroP.coins}`);
    return;
  }
  heroP.coins-=plan.cost;
  heroP.xp+=plan.xp;
  let lvup=0;
  while(heroP.xp>=xpForLevel(heroP.level)){
    heroP.xp-=xpForLevel(heroP.level);
    heroP.level++;
    heroP.sp++;
    lvup++;
  }
  saveProgress(progress);
  if(lvup>0) toast(`Тренировка успешна! Уровней: +${lvup}`);
  else toast('Тренировка завершена: XP получен');
  render();
};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}

// ─────────────────────────────────────────────────
// Инициализация
// ─────────────────────────────────────────────────
render();
</script>
</body>
</html>
